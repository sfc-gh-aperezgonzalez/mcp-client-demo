<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <!-- Brand palette -->
    <style>
      .t0{font:700 58px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f2b46}
      .t1{font:400 28px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#3a4a5a}
      .lbl{font:700 22px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#0f2b46}
      .sm{font:500 18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#2b4357}
      .host{stroke:#29b5e8;stroke-width:4;stroke-dasharray:12 10;fill:rgba(41,181,232,.06)}
      .card{fill:#e9f7fd;stroke:#29b5e8;stroke-width:2;rx:14;ry:14}
      .server{fill:#0b5cab;rx:16;ry:16}
      .serverTitle{font:700 22px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#fff}
      .serverSub{font:500 18px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#cfe6ff}
      .pill{fill:#e8f1ff;stroke:#0b5cab;stroke-width:1.6;rx:20;ry:20}
      .arrow{stroke:#0b5cab;stroke-width:3;fill:none;marker-end:url(#ah)}
      .arrow2{stroke:#0b5cab;stroke-width:3;fill:none;stroke-dasharray:8 8;marker-end:url(#ah)}
    </style>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0,0 12,6 0,12" fill="#0b5cab"/>
    </marker>
    <!-- server rack pictogram -->
    <g id="rack">
      <rect x="0" y="0" width="52" height="52" rx="10" ry="10" fill="#0a4b8f" stroke="#cfe6ff" stroke-width="2"/>
      <rect x="10" y="12" width="32" height="6" rx="3" fill="#cfe6ff"/>
      <rect x="10" y="23" width="32" height="6" rx="3" fill="#cfe6ff"/>
      <rect x="10" y="34" width="32" height="6" rx="3" fill="#cfe6ff"/>
    </g>
    <!-- simple snowflake glyph -->
    <g id="flake" transform="scale(1.1)">
      <g stroke="#29b5e8" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="-36" x2="0" y2="36"/>
        <line x1="-31" y1="-18" x2="31" y2="18"/>
        <line x1="-31" y1="18" x2="31" y2="-18"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#29b5e8"/>
    </g>
    <!-- subtle shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b5cab" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="48" y="86" class="t0">MCP Demo Architecture</text>
  <text x="48" y="126" class="t1">Seamless integration between LangChain agents and Snowflake Managed MCP Server</text>

  <!-- Left column: MCP Host -->
  <rect x="48" y="176" width="500" height="620" class="host"/>
  <text x="70" y="210" class="lbl">MCP Host</text>
  <text x="70" y="238" class="sm">LangChain / LangGraph • Python</text>

  <!-- LLM badge -->
  <circle cx="120" cy="290" r="32" fill="#29b5e8" opacity="0.15"/>
  <circle cx="120" cy="290" r="30" fill="#e9f7fd" stroke="#29b5e8" stroke-width="2"/>
  <text x="98" y="298" class="lbl" style="font-size:18px">LLM</text>

  <!-- MCP Client cards -->
  <rect x="70" y="330" width="430" height="110" class="card" filter="url(#shadow)"/>
  <text x="92" y="368" class="lbl">MCP Client</text>
  <text x="92" y="396" class="sm">Tool discovery &amp; invocation</text>

  <rect x="70" y="468" width="430" height="110" class="card" filter="url(#shadow)"/>
  <text x="92" y="506" class="lbl">LangChain Agent (Supervisor)</text>
  <text x="92" y="534" class="sm">Reasoning • tool selection • synthesis</text>

  <!-- External action (simple) -->
  <rect x="70" y="606" width="430" height="110" class="card" filter="url(#shadow)"/>
  <text x="92" y="644" class="lbl">Business Action (Simulated)</text>
  <text x="92" y="672" class="sm">external_sales_handoff(…)</text>

  <!-- MCP protocol pill -->
  <rect x="150" y="742" width="270" height="40" class="pill"/>
  <text x="168" y="768" class="sm" style="fill:#0b5cab;font-weight:700">MCP Protocol</text>

  <!-- Arrow to server -->
  <path d="M548,762 C640,762 720,762 780,762" class="arrow"/>

  <!-- Center: MCP Server -->
  <g transform="translate(820,620)">
    <rect x="0" y="0" width="420" height="160" class="server" filter="url(#shadow)"/>
    <use href="#rack" x="24" y="32"/>
    <text x="92" y="66" class="serverTitle">MCP Server (Snowflake)</text>
    <text x="92" y="98" class="serverSub">Tool: Cortex Agent (troubleshooter_agent)</text>
  </g>

  <!-- Curved arrow from agent block to server -->
  <path d="M500,520 C690,520 760,560 900,620" class="arrow"/>

  <!-- Right: Snowflake cloud -->
  <g transform="translate(1280,640)">
    <circle cx="50" cy="80" r="58" fill="#f7fbff" stroke="#cfe6ff"/>
    <use href="#flake" x="50" y="80"/>
    <text x="120" y="88" class="lbl" style="fill:#29b5e8">snowflake</text>
  </g>

  <!-- Dashed from server to snowflake -->
  <path d="M1240,700 C1260,700 1270,700 1280,700" class="arrow2"/>

  <!-- Top-right flow mini legend -->
  <g transform="translate(980,176)">
    <rect x="0" y="0" width="540" height="170" fill="#fff" stroke="#cfe6ff" rx="14" ry="14"/>
    <text x="18" y="40" class="lbl">Flow</text>
    <text x="18" y="72" class="sm">1. Agent receives goal and discovers tools</text>
    <text x="18" y="98" class="sm">2. Calls Snowflake MCP Server (Cortex Agent)</text>
    <text x="18" y="124" class="sm">3. Results returned → agent synthesizes</text>
  </g>
</svg>


